services:
  # ── Backend Web Service (ASP.NET Core 8 Web API) ────────────
  - type: web
    name: pharmpos-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: pharmpos-db
          property: connectionString
      - key: Jwt__Key
        generateSecret: true
      - key: Jwt__Issuer
        value: PharmPOS
      - key: Jwt__Audience
        value: PharmPOS
      - key: Jwt__ExpiryHours
        value: "8"
      - key: Cors__AllowedOrigins__0
        fromService:
          type: static
          name: pharmpos-web
          property: url
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

  # ── Frontend Static Site (React Vite App) ────────────────────
  - type: static
    name: pharmpos-web
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pharmpos-api
          property: url

databases:
  # ── Managed PostgreSQL Database ─────────────────────────────
  - name: pharmpos-db
    databaseName: pharmpos
    user: pharmpos_user
    region: oregon
    plan: starter
