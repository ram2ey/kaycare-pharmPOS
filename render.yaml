services:
  # ── Backend Web Service (ASP.NET Core 8 Web API - 100% Free Tier) ────────────
  - type: web
    name: pharmpos-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: PharmPOS
      - key: Jwt__Audience
        value: PharmPOS
      - key: Jwt__ExpiryHours
        value: "8"
      - key: Cors__AllowedOrigins__0
        fromService:
          type: web
          name: pharmpos-web
          property: host
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

  # ── Frontend Static Site (React Vite App - 100% Free Tier) ───────────────────
  - type: web
    name: pharmpos-web
    env: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pharmpos-api
          property: host
